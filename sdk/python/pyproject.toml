[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-sdk"
version = "1.0.0"
description = "Enterprise SDK for Autonomous AI Platform"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "tenacity>=9.0.0",
    "websockets>=15.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]