apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: platform
spec:
  replicas: 3

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: auth-service
          image: ghcr.io/company/auth-service:latest

          ports:
            - containerPort: 4000

          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: platform-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: 4000

          livenessProbe:
            httpGet:
              path: /health
              port: 4000

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi