apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-service
  namespace: platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: project-service
  template:
    metadata:
      labels:
        app: project-service
    spec:
      containers:
        - name: project-service
          image: ghcr.io/company/project-service:latest
          ports:
            - containerPort: 4003