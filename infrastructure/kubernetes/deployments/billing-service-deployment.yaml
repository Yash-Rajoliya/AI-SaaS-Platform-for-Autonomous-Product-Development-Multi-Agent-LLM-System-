apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
    spec:
      containers:
        - name: billing-service
          image: ghcr.io/company/billing-service:latest
          ports:
            - containerPort: 4004