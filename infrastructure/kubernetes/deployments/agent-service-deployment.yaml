apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: ai-runtime
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-service
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: ghcr.io/company/agent-service:latest
          ports:
            - containerPort: 4001
          envFrom:
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"