apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      containers:
        - name: execution-service
          image: ghcr.io/company/execution-service:latest
          ports:
            - containerPort: 4002
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"