apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monitoring-service
  template:
    metadata:
      labels:
        app: monitoring-service
    spec:
      containers:
        - name: monitoring-service
          image: ghcr.io/company/monitoring-service:latest
          ports:
            - containerPort: 4005