server:
  http_listen_port: 3200

distributor:
  receivers:

    otlp:
      protocols:
        grpc:
        http:

    jaeger:
      protocols:
        grpc:
        thrift_http:
        thrift_binary:
        thrift_compact:

ingester:

  trace_idle_period: 10s

  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 720h

storage:

  trace:
    backend: local

    local:
      path: /var/tempo/traces

query_frontend:
  search:
    duration_slo: 5s

metrics_generator:

  storage:
    path: /var/tempo/generator

overrides:
  per_tenant_override_config: /etc/tempo/overrides.yaml