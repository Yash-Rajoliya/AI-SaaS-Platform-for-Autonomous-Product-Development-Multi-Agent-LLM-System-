receivers:

  otlp:
    protocols:
      grpc:
      http:

processors:

  batch:

  memory_limiter:
    limit_mib: 2048

exporters:

  otlp:
    endpoint: tempo:4317

    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

service:

  pipelines:

    traces:
      receivers:
        - otlp

      processors:
        - memory_limiter
        - batch

      exporters:
        - otlp

    metrics:
      receivers:
        - otlp

      processors:
        - batch

      exporters:
        - prometheus