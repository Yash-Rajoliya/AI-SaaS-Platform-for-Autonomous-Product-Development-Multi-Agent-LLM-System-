log_level: INFO

storage:
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334

cluster:
  enabled: true

telemetry_disabled: false

performance:
  max_search_threads: 16

optimizers:
  deleted_threshold: 0.2
  vacuum_min_vector_number: 1000
  default_segment_number: 4
  max_segment_size_kb: 524288

hnsw_index:
  m: 32
  ef_construct: 256
  full_scan_threshold: 10000

wal:
  wal_capacity_mb: 512
  wal_segments_ahead: 2

snapshots:
  snapshot_interval_sec: 3600

tls:
  cert: /certs/tls.crt
  key: /certs/tls.key