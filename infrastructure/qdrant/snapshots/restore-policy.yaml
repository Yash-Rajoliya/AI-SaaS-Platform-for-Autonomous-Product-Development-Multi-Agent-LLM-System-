apiVersion: batch/v1
kind: Job

metadata:
  name: qdrant-restore
  namespace: platform

spec:
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: restore

          image: curlimages/curl:latest

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "Starting Qdrant restore..."

              curl \
              -X POST \
              http://qdrant-service:6333/collections/restore

              echo "Restore complete"