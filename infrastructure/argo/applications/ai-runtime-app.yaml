apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-runtime-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/company/ai-saas-platform
    targetRevision: main
    path: services

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-runtime

  syncPolicy:
    automated:
      prune: true
      selfHeal: true