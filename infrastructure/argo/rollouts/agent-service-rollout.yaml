apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: agent-service
  namespace: ai-runtime
spec:
  replicas: 5

  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 3m

        - setWeight: 50
        - pause:
            duration: 5m

        - setWeight: 100

  selector:
    matchLabels:
      app: agent-service

  template:
    metadata:
      labels:
        app: agent-service
    spec:
      containers:
        - name: agent-service
          image: agent-service:latest