user default off

user platform-admin on >platform_admin_password ~* +@all

user application on >application_password ~platform:* +@read +@write

user analytics on >analytics_password ~metrics:* +@read

user observability on >observability_password ~logs:* +@read

user cache-worker on >cache_worker_password ~cache:* +@read +@write

user replication on >replication_password +psync +replconf