apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-exporter
  namespace: observability

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.16.0

          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: exporter-dsn

          ports:
            - containerPort: 9187

---
apiVersion: v1
kind: Service

metadata:
  name: postgres-exporter
  namespace: observability

spec:
  selector:
    app: postgres-exporter

  ports:
    - port: 9187
      targetPort: 9187
      name: metrics