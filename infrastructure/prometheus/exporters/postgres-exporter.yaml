apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-exporter

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres-exporter

  template:
    metadata:
      labels:
        app: postgres-exporter

    spec:
      containers:
        - name: postgres-exporter

          image: prometheuscommunity/postgres-exporter:latest

          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: database-secrets
                  key: postgres-dsn

          ports:
            - containerPort: 9187