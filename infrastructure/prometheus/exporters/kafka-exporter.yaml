apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka-exporter

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-exporter

  template:
    metadata:
      labels:
        app: kafka-exporter

    spec:
      containers:
        - name: kafka-exporter

          image: danielqsj/kafka-exporter:latest

          args:
            - --kafka.server=kafka-service:9092

          ports:
            - containerPort: 9308