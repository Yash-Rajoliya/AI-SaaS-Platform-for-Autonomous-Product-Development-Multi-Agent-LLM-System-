global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-saas-platform
    environment: production

rule_files:
  - /etc/prometheus/alert-rules.yml
  - /etc/prometheus/recording-rules.yml

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: kubernetes
    file_sd_configs:
      - files:
          - /etc/prometheus/scrape-configs/kubernetes.yaml

  - job_name: platform-services
    file_sd_configs:
      - files:
          - /etc/prometheus/scrape-configs/services.yaml

  - job_name: istio
    file_sd_configs:
      - files:
          - /etc/prometheus/scrape-configs/istio.yaml

  - job_name: node-exporter
    file_sd_configs:
      - files:
          - /etc/prometheus/scrape-configs/node-exporter.yaml