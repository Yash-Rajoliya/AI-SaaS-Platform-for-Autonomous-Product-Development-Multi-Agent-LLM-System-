apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway-dr
  namespace: platform
spec:
  host: api-gateway.platform.svc.cluster.local

  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

    loadBalancer:
      simple: LEAST_CONN

    connectionPool:
      tcp:
        maxConnections: 500
      http:
        http1MaxPendingRequests: 1000
        maxRequestsPerConnection: 100

    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 2m